<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- open book -->
  <g transform="translate(32,35)">
    <!-- left page -->
    <path d="M -22 -8 C -14 -12, -6 -12, 0 -7 L 0 15 C -6 10, -14 10, -22 14 Z" fill="url(#pageL)" stroke="url(#g)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- right page -->
    <path d="M 22 -8 C 14 -12, 6 -12, 0 -7 L 0 15 C 6 10, 14 10, 22 14 Z" fill="url(#pageL)" stroke="url(#g)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- page lines -->
    <path d="M -18 -3 L -3 -6 M -18 2 L -3 -1 M -18 7 L -3 4" stroke="url(#g)" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <path d="M 18 -3 L 3 -6 M 18 2 L 3 -1 M 18 7 L 3 4" stroke="url(#g)" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- spark above the book -->
  <path d="M 32 10 L 34.2 15.8 L 40 18 L 34.2 20.2 L 32 26 L 29.8 20.2 L 24 18 L 29.8 15.8 Z" fill="url(#g)"/>
</svg>
